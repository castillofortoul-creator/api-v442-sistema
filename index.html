<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framework Predictivo V44.2</title>
    <style>
        body { font-family: sans-serif; background-color: #0c1917; color: #ffffff; margin: 20px; }
        .container { max-width: 600px; margin: auto; padding: 20px; background-color: #112622; border: 2px solid #00ffcc; border-radius: 8px; }
        h2 { text-align: center; color: #00ffcc; border-bottom: 2px solid #00ffcc; padding-bottom: 10px; margin-top: 0; }
        h4 { text-align: center; color: #aaaaaa; margin-top: -5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #00ffcc; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; background-color: #0c1917; color: #fff; border: 1px solid #00ffcc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #00aa88; color: #fff; border: 1px solid #00ffcc; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #00ffcc; color: #0c1917; }
        .results { margin-top: 20px; padding: 15px; background-color: #0c1917; border-radius: 4px; border: 1px solid #00ffcc; }
        .error { margin-top: 20px; padding: 15px; background-color: #4a1a1a; border-radius: 4px; border-left: 5px solid #ff3333; color: #ff9999; text-align: center; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>FRAMEWORK PREDICTIVO V44.2</h2>
    <h4>GRUPO DE DINÁMICA ATMOSFÉRICA AVANZADA - KOMCHÉN, YUCATÁN</h4>
    
    <div class="form-group">
        <label for="vance">NOMBRE DEL CICLÓN</label>
        <input type="text" id="vance" value="patricia">
    </div>
    
    <div class="grid">
        <div class="form-group">
            <label for="presion_central_minima">PRESIÓN CENTRAL MÍNIMA (HPA / MB)</label>
            <input type="number" id="presion_central_minima" value="950">
        </div>
        
        <div class="form-group">
            <label for="vientos_sostenidos">VIENTOS SOSTENIDOS (KM/H)</label>
            <input type="number" id="vientos_sostenidos" value="165">
        </div>
    </div>
    
    <button onclick="calculateModule()">EJECUTAR SIMULACIÓN CIEGA</button>
    
    <div id="error-container" class="error" style="display: none;"></div>
    
    <div id="results-container" class="results" style="display: none;">
        <p><strong>MAGNITUD FUENTE (R_SOURCE):</strong> <span id="r_source_val"></span></p>
        <p><strong>BALANCE NETO (B):</strong> <span id="balance_val"></span></p>
        <p><strong>ESTATUS DEL DIAGNÓSTICO:</strong> <span id="diag_val"></span></p>
    </div>
</div>

<script>
async function calculateModule() {
    const vanceValue = document.getElementById('vance').value;
    const presionValue = document.getElementById('presion_central_minima').value;
    const vientosValue = document.getElementById('vientos_sostenidos').value;
    
    const errorContainer = document.getElementById('error-container');
    const resultsContainer = document.getElementById('results-container');
    
    errorContainer.style.display = "none";
    resultsContainer.style.display = "none";
    
    try {
        // LA URL TIENE QUE ESTAR COMPLETA E IMPECABLE AQUÍ:
        const url = `https://onrender.com{encodeURIComponent(vanceValue)}&presion_central_minima=${presionValue}&vientos_sostenidos=${vientosValue}`;
        const res = await fetch(url);
        
        if (!res.ok) {
            throw new Error(`El servidor respondió con código: ${res.status}`);
        }
        
        const data = await res.json();
        
        document.getElementById('r_source_val').innerText = data.r_source;
        document.getElementById('balance_val').innerText = data.balance;
        document.getElementById('diag_val').innerText = data.resultado;
        
        resultsContainer.style.display = "block";
    } catch (err) {
        errorContainer.innerText = "Error de conexión con la API (" + err.message + "). Intenta refrescar la página con parámetros diferentes.";
        errorContainer.style.display = "block";
    }
}
</script>

</body>
</html>
