<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framework V44.2 - Mapa + NHC</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; background:#0c1917; color:#fff; margin:0; padding:15px; }
        .container { max-width:800px; margin:auto; padding:20px; background:#112622; border:2px solid #00ffcc; border-radius:8px; }
        h2 { text-align:center; color:#00ffcc; border-bottom:2px solid #00ffcc; padding-bottom:10px; margin-top:0; }
        h4 { text-align:center; color:#aaa; margin-top:-5px; font-size:13px; }
        label { display:block; margin:10px 0 5px; font-weight:bold; color:#00ffcc; font-size:12px; }
        input { width:100%; padding:10px; box-sizing:border-box; background:#0c1917; color:#fff; border:1px solid #00ffcc; border-radius:4px; }
        button { width:100%; padding:12px; margin-top:15px; background:#00aa88; color:#fff; border:1px solid #00ffcc; border-radius:4px; font-size:16px; cursor:pointer; font-weight:bold; }
        button:hover { background:#00ffcc; color:#0c1917; }
        .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .results { margin-top:15px; padding:15px; background:#0c1917; border:1px solid #00ffcc; border-radius:4px; font-size:14px; line-height:1.6; }
        .comparativa { margin-top:15px; padding:15px; background:#1a3a32; border-left:5px solid #ffcc00; border-radius:4px; }
        .veredicto { font-weight:bold; color:#00ffcc; font-size:16px; text-align:center; margin:10px 0; }
        #map { height:400px; margin-top:15px; border:2px solid #00ffcc; border-radius:6px; display:none; }
        .legend { font-size:12px; margin-top:8px; color:#ccc; }
        .dot-v442 { color:#ff3333; } .dot-nhc { color:#3388ff; }
        .error { margin-top:15px; padding:12px; background:#4a1a1a; border-left:5px solid #ff3333; color:#ff9999; font-weight:bold; text-align:center; display:none; }
    </style>
</head>
<body>
<div class="container">
    <h2>FRAMEWORK PREDICTIVO V44.2</h2>
    <h4>GRUPO DINÁMICA ATMOSFÉRICA - KOMCHÉN + COMPARATIVA NHC TIEMPO REAL</h4>
    
    <label>NOMBRE DEL CICLÓN</label>
    <input type="text" id="vance" value="vance">
    
    <div class="grid">
        <div><label>PRESIÓN CENTRAL MÍNIMA (MB)</label><input type="number" id="presion" value="1003"></div>
        <div><label>VIENTOS SOSTENIDOS (KM/H)</label><input type="number" id="vientos" value="65"></div>
    </div>
    
    <button onclick="ejecutar()">EJECUTAR SIMULACIÓN + MAPA + NHC</button>
    
    <div id="error" class="error"></div>
    <div id="results" class="results" style="display:none;"></div>
    <div id="comparativa" class="comparativa" style="display:none;"></div>
    <div id="map"></div>
    <div id="legend" class="legend" style="display:none;">
        <span class="dot-v442">●</span> Predicción V44.2 Landfall | 
        <span class="dot-nhc">●</span> Posición Actual NHC
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API_URL = "https://api-v442.onrender.com";
let map, markerV442, markerNHC, line;

async function ejecutar(){
    const v = document.getElementById('vance').value;
    const p = document.getElementById('presion').value;
    const wi = document.getElementById('vientos').value;
    const errDiv = document.getElementById('error');
    const resDiv = document.getElementById('results');
    const compDiv = document.getElementById('comparativa');
    
    errDiv.style.display="none";
    resDiv.style.display="none";
    compDiv.style.display="none";
    
    const url = ${API_URL}/v442?vance=${encodeURIComponent(v)}&presion_central_minima=${p}&vientos_sostenidos=${wi};
    
    try{
        const res = await fetch(url);
        if(!res.ok) throw new Error("API dormida o error "+res.status);
        const data = await res.json();
        
        resDiv.style.display="block";
        resDiv.innerHTML = `
            <b>MAGNITUD FUENTE (R_SOURCE):</b> ${data.r_source}<br>
            <b>BALANCE NETO (B):</b> ${data.balance}<br>
            <b>ESTATUS:</b> ${data.resultado}<br>
            <b>DONDE VA A PEGAR (V44.2):</b> <span style="color:#ffcc00; font-weight:bold;">${data.landfall_prediccion_v442.lugar}</span><br>
            Coords: ${data.landfall_prediccion_v442.lat}, ${data.landfall_prediccion_v442.lon}
        `;
        
        compDiv.style.display="block";
        compDiv.innerHTML = `
            <div class="veredicto">${data.comparativa.veredicto}</div>
            <b>NHC LIVE:</b> ${data.nhc_live.lat}N ${Math.abs(data.nhc_live.lon)}W - ${data.nhc_live.dist || ''} | Viento ${data.nhc_live.wind_mph||'N/A'} mph<br>
            <b>NHC WARNINGS:</b> ${data.nhc_live.warnings}<br>
            <b>VS V44.2:</b> ${data.comparativa.tu_prediccion}<br>
            <b>AHORRO:</b> ${data.comparativa.ahorro_estimado}<br>
            <small>Advisory: ${data.nhc_live.advisory || data.nhc_live.raw} | Fuente: nhc.noaa.gov</small>
        `;
        
        // MAPA
        document.getElementById('map').style.display="block";
        document.getElementById('legend').style.display="block";
        
        if(!map){
            map = L.map('map').setView([20, -105], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM + NHC + V44.2' }).addTo(map);
        }
        
        if(markerV442) map.removeLayer(markerV442);
        if(markerNHC) map.removeLayer(markerNHC);
        if(line) map.removeLayer(line);
        
        // Marker NHC - Azul
        const nhcIcon = L.divIcon({html: '<div style="background:#3388ff; width:14px; height:14px; border-radius:50%; border:2px solid white;"></div>', iconSize:[14,14]});
        markerNHC = L.marker([data.nhc_live.lat, data.nhc_live.lon], {icon: nhcIcon}).addTo(map)
            .bindPopup(<b>NHC ACTUAL</b><br>${data.nhc_live.lat}N ${Math.abs(data.nhc_live.lon)}W<br>${data.nhc_live.dist}).openPopup();
        
        // Marker V44.2 - Rojo solo si hay landfall
        if(data.landfall_prediccion_v442.lat !== 0){
            const v442Icon = L.divIcon({html: '<div style="background:#ff3333; width:16px; height:16px; border-radius:50%; border:2px solid white;"></div>', iconSize:[16,16]});
            markerV442 = L.marker([data.landfall_prediccion_v442.lat, data.landfall_prediccion_v442.lon], {icon: v442Icon}).addTo(map)
                .bindPopup(<b>V44.2 PREDICCIÓN LANDFALL</b><br>${data.landfall_prediccion_v442.lugar}<br>B=${data.balance});
            line = L.polyline([[data.nhc_live.lat, data.nhc_live.lon], [data.landfall_prediccion_v442.lat, data.landfall_prediccion_v442.lon]], {color:'#ffcc00', dashArray:'5,10'}).addTo(map);
            map.fitBounds([[data.nhc_live.lat, data.nhc_live.lon], [data.landfall_prediccion_v442.lat, data.landfall_prediccion_v442.lon]], {padding:[40,40]});
        } else {
            // Vance Zero Landfall
            map.setView([data.nhc_live.lat, data.nhc_live.lon], 6);
            markerNHC.bindPopup(<b>NHC + V44.2 COINCIDEN</b><br>ZERO LANDFALL DIRECTO<br>Se disipa a ${data.nhc_live.dist}).openPopup();
        }
        
    }catch(e){
        errDiv.innerText = "Error de conexión con API ("+e.message+"). Render gratis
